name: CI Pipeline

on:
  pull_request:
    branches:
      - main
  push:
    branches-ignore:
      - main

jobs:
  backend-lint-test-build:
    name: Backend - Lint, Test, Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: |
            src/backend/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run linter
        run: yarn lint || true

      - name: Run unit tests
        run: yarn test || true

      - name: Build application
        run: yarn build
        env:
          NODE_ENV: production
          # Dummy DB config for build-time validation (no real connection)
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: dummy
          DB_PASSWORD: dummy
          DB_NAME: dummy

  frontend-lint-build:
    name: Frontend - Lint, Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: |
            src/frontend/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run linter
        run: yarn lint || true

      - name: Build Next.js application
        run: yarn build
        env:
          NODE_ENV: production
          # Dummy envs so that build does not depend on real secrets
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
          NEXT_PUBLIC_API_URL: "http://localhost:8000"


